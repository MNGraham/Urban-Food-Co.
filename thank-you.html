<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Urban Food Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a08;
    --gold: #c8962a;
    --gold-light: #e8b84b;
    --cream: #f0e8d5;
    --muted: #8a8070;
    --green: #3d5a3e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .container {
    max-width: 560px;
  }
  .check {
    font-size: 3.5rem;
    margin-bottom: 1.5rem;
    display: block;
  }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 2rem;
    display: block;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    line-height: 1;
    letter-spacing: 0.02em;
    margin-bottom: 1.5rem;
  }
  h1 em {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    color: var(--gold);
  }
  p {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }
  p strong { color: var(--cream); font-weight: 500; }
  .divider {
    width: 60px;
    height: 1px;
    background: rgba(200,150,42,0.3);
    margin: 0 auto 2.5rem;
  }
  .btn {
    display: inline-block;
    background: var(--gold);
    color: var(--black);
    padding: 1rem 2rem;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--gold-light); }
</style>
</head>
<body>
  <div class="container">
    <span class="check">✓</span>
    <span class="brand">Urban Food Co.</span>
    <h1>Request <em>Received.</em></h1>
    <div class="divider"></div>
    <p>
      Thank you for your interest. <strong>Michael will follow up personally within 24 hours</strong> with your LOI document and next steps. Check your inbox — and your spam folder just in case.
    </p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
